name: course-ci

on:
  pull_request:
  push:
    branches:
      - main
      - "agent/**"
      - "release/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  structure:
    name: repository structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate links, state, and course invariants
        run: python3 scripts/validate_repository.py

  build:
    name: ${{ matrix.compiler }} C++17
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: GCC
            cxx: g++
          - compiler: Clang
            cxx: clang++
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        env:
          CXX: ${{ matrix.cxx }}
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
      - name: Build with warnings as errors
        run: cmake --build build --parallel
      - name: Run examples and intentional-failure checks
        run: ctest --test-dir build --output-on-failure

  sanitizers:
    name: ASan and UBSan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure sanitizers
        env:
          CXX: g++
        run: >-
          cmake -S . -B build-sanitize
          -DCMAKE_BUILD_TYPE=Debug
          -DCPP_LEARNING_ENABLE_SANITIZERS=ON
      - name: Build
        run: cmake --build build-sanitize --parallel
      - name: Run
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build-sanitize --output-on-failure
